# El proyecto de Xcode sale de acá: `xcodegen generate` (el .xcodeproj no se versiona).
name: TengoLibre
options:
  bundleIdPrefix: ar.com.tengolibre
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  TengoLibre:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/TengoLibre.xcconfig
      Release: Config/TengoLibre.xcconfig
    sources:
      - path: TengoLibre
      - path: Compartido
    dependencies:
      - target: TengoLibreWidgets
    entitlements:
      path: TengoLibre/TengoLibre.entitlements
      properties:
        # development en Debug (lo instalado desde Xcode), production en Release.
        aps-environment: $(APS_ENTORNO)
        # La sesión, compartida con los widgets y la Live Activity.
        keychain-access-groups:
          - $(AppIdentifierPrefix)ar.com.tengolibre.app
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.tengolibre.app
        PRODUCT_NAME: TengoLibre
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APS_ENTORNO: development
        Release:
          APS_ENTORNO: production
          # TestFlight por GitHub Actions con firma manual (testflight.yml): un perfil por target.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.tengolibre.app App Store
    info:
      path: TengoLibre/Info.plist
      properties:
        CFBundleDisplayName: Tengo Libre
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLApi: $(TL_API)
        TLWeb: $(TL_WEB)
        TLClerk: $(TL_CLERK)
        TLGrupoLlavero: $(AppIdentifierPrefix)ar.com.tengolibre.app
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          # tengolibre://turno/{id}, tengolibre://hoy, tengolibre://espera (push, widgets, Live Activity).
          - CFBundleURLName: ar.com.tengolibre.app.enlaces
            CFBundleURLSchemes: [tengolibre]
          # La vuelta del ingreso con Google por Clerk.
          - CFBundleURLName: ar.com.tengolibre.app
            CFBundleURLSchemes: [ar.com.tengolibre.app]
        UIAppFonts:
          - Lato-Regular.ttf
          - Lato-Bold.ttf
          - Lato-Black.ttf
        UILaunchScreen:
          UIColorName: Cabecera
          UIImageName: SimboloBlanco
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Para sacar la foto de tu negocio, de tu equipo o de tus servicios."
        NSPhotoLibraryUsageDescription: "Para elegir la foto de tu negocio, de tu equipo o de tus servicios."
        NSPhotoLibraryAddUsageDescription: "Para guardar el QR y la imagen de tu página para historias."
        NSLocationWhenInUseUsageDescription: "Para mostrarte los lugares que reservan con Tengo Libre cerca tuyo."
        LSApplicationQueriesSchemes: [whatsapp, instagram-stories]
        NSAppTransportSecurity:
          # Sólo para probar contra la API local (http://127.0.0.1:4200).
          NSAllowsLocalNetworking: true
  TengoLibreWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/TengoLibre.xcconfig
      Release: Config/TengoLibre.xcconfig
    sources:
      - path: TengoLibreWidgets
      - path: Compartido
      - path: TengoLibre/Recursos/Fuentes
        buildPhase: resources
    entitlements:
      path: TengoLibreWidgets/TengoLibreWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)ar.com.tengolibre.app
    info:
      path: TengoLibreWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tengo Libre
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLApi: $(TL_API)
        TLGrupoLlavero: $(AppIdentifierPrefix)ar.com.tengolibre.app
        UIAppFonts:
          - Lato-Regular.ttf
          - Lato-Bold.ttf
          - Lato-Black.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.tengolibre.app.Widgets
        PRODUCT_NAME: TengoLibreWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.tengolibre.app.Widgets App Store
  TengoLibreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TengoLibreTests]
    dependencies:
      - target: TengoLibre
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TengoLibreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TengoLibreUITests]
    dependencies:
      - target: TengoLibre
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TengoLibre
schemes:
  # Los recorridos de punta a punta (XCUITest) con la app en modo prueba: en Debug.
  Recorridos:
    build:
      targets:
        TengoLibre: all
        TengoLibreUITests: [test]
    test:
      config: Debug
      targets: [TengoLibreUITests]
  TengoLibre:
    build:
      targets:
        TengoLibre: all
        TengoLibreTests: [test]
    test:
      targets: [TengoLibreTests]
