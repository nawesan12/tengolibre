# Los recorridos de punta a punta (XCUITest, como Playwright) con la app en modo prueba. Tardan (los
# runners Mac gratis son Intel), así que no van en cada compilación: se corren a mano para revisar
# (`gh workflow run recorridos`) y dejan una captura por paso en el artifact «recorridos».
name: recorridos

on:
  workflow_dispatch:

jobs:
  recorrer:
    runs-on: ${{ vars.RUNNER_MAC || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Recorridos
        id: recorridos
        env:
          # Una captura por paso de cada recorrido (como Playwright), para revisarlas.
          TEST_RUNNER_CAPTURAS: ${{ runner.temp }}/recorridos
        run: |
          set -o pipefail
          # En los runners Intel el simulador tarda: se arranca de cero y se espera a que esté listo, y si
          # XCUITest no llega a iniciar («AX loaded notification») se reintenta una vez.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for v in d.values() for x in v if x['name']=='iPhone 16'][0])")
          xcrun simctl shutdown all || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 20
          correr() {
            xcodebuild test -project TengoLibre.xcodeproj -scheme Recorridos -configuration Debug \
              -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
              | tee recorridos.log | xcbeautify --renderer github-actions
          }
          correr || { grep -q 'failed to initialize' recorridos.log && { sleep 30; correr; }; }
      - if: failure()
        run: grep -E -B2 -A20 'error:|failed|Fatal error|crashed' recorridos.log | head -150
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorridos
          path: ${{ runner.temp }}/recorridos
          if-no-files-found: ignore
