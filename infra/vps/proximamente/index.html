<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tengo Libre · Turnos online</title>
<meta name="description" content="Turnos online para barberías, salones y negocios con agenda. De Grupo Vimo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--fondo:oklch(0.97 0.025 155);--tinta:oklch(0.17 0.012 265);--suave:oklch(0.45 0.02 265);--marca:oklch(0.8 0.16 152);--hondo:oklch(0.43 0.12 155)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(180deg,var(--fondo),oklch(0.92 0.05 155));color:var(--tinta);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;text-align:center}
.marca{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.punto{width:14px;height:14px;border-radius:50%;background:var(--marca);box-shadow:0 0 0 6px oklch(0.8 0.16 152 / .2)}
h1{margin:28px 0 14px;font-size:clamp(32px,7vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
p{margin:0 auto;max-width:44ch;font-size:17px;line-height:1.5;color:var(--suave);text-wrap:pretty}
.estado{display:inline-block;margin-top:28px;padding:8px 14px;border-radius:999px;background:#fff;color:var(--hondo);font-size:14px;font-weight:600}
a{color:var(--hondo)}
</style>
</head>
<body>
<main>
  <div class="marca"><span class="punto" aria-hidden="true"></span>Tengo Libre</div>
  <h1>Que tus clientes saquen turno&nbsp;solos.</h1>
  <p>El cliente reserva a cualquier hora y recibe el recordatorio antes de venir. Estamos preparando la nueva versión; muy&nbsp;pronto.</p>
  <span class="estado">Escribinos a <a href="mailto:hola@tengolibre.com.ar">hola@tengolibre.com.ar</a></span>
</main>
</body>
</html>
