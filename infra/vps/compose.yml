# TengoLibre en el VPS (/opt/tengolibre). Postgres propio; la api es un binario estático montado en
# una alpine (se despliega subiendo bin/*.nuevo y haciendo mv: el binario en uso no se pisa).
# Publicado sólo en 127.0.0.1: Docker se saltea UFW. Puertos reservados: 4200 api, 3400 web.
name: tengolibre
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg
    volumes:
      - ./pg:/var/lib/postgresql/data
      - ./pg.secret:/run/secrets/pg:ro
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 30
  api:
    image: alpine:3.20
    restart: unless-stopped
    command: ['/app/api']
    env_file: ./api.conf
    volumes:
      - ./bin:/app:ro
      # Imágenes que suben los negocios (TENGOLIBRE_ARCHIVOS). No entra en el pg_dump: copiarla aparte.
      - ./archivos:/datos/archivos
      # La cuenta de servicio de Google Play (suscripciones de Android; TENGOLIBRE_PLAY_CUENTA). Nunca al repo.
      - ./claves/play.json:/claves/play.json:ro
    ports: ['127.0.0.1:4200:4200']
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
  # Trabajos en segundo plano (cola de mails, recordatorios, reseñas, resumen, purga). Mismo
  # api.conf que la api; sale por el SMTP propio (TENGOLIBRE_SMTP*). No publica puertos.
  worker:
    image: alpine:3.20
    restart: unless-stopped
    command: ['/app/worker']
    env_file: ./api.conf
    volumes:
      - ./bin:/app:ro
      # Claves del push (TENGOLIBRE_APNS_CLAVE y TENGOLIBRE_FCM_CUENTA): el .p8 de Apple y la cuenta
      # de servicio de FCM. Nunca al repo.
      - ./claves:/claves:ro
      # Las imágenes: la purga de negocios cerrados (TENGOLIBRE_PURGA_NEGOCIOS=1) borra las suyas.
      - ./archivos:/datos/archivos
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
  # El front (SvelteKit + adapter-node). Se despliega subiendo web/build (rsync) y reiniciando. Le
  # habla a la api por la red del compose; Caddy le manda tengolibre.com.ar y los dominios propios.
  web:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: ['node', 'build/index.js']
    env_file: ./web.conf
    volumes:
      - ./web/build:/app/build:ro
      - ./web/package.json:/app/package.json:ro
    ports: ['127.0.0.1:3400:3400']
    mem_limit: 160m
    depends_on: [api]
